# Тег v* → готовые офлайн-архивы в GitHub Releases:
#   docdiff-X.Y.Z-linux-x86_64.tar.gz   портативный (Python внутри), x86_64
#   docdiff-X.Y.Z-linux-aarch64.tar.gz  портативный, ARM
#   docdiff-X.Y.Z-docker-amd64.tar.gz   Docker-образ + compose
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  portable:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Build
        run: ARCH=${{ matrix.arch }} PYTHON=python scripts/build_bundle.sh portable
      - name: Smoke test (распаковать и запустить)
        run: |
          mkdir /tmp/t && tar xzf dist/*.tar.gz -C /tmp/t && cd /tmp/t/docdiff
          NO_SYSTEMD=1 ./install.sh
          sed -i 's/^PORT=.*/PORT=18080/' .env
          ./start.sh > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS localhost:18080/health && break; sleep 1; done
          curl -fsS localhost:18080/health || { echo "::error::$(tail -c 600 /tmp/server.log | tr '\n' ' ')"; exit 1; }
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -F file_a=@install.sh -F file_b=@start.sh localhost:18080/api/compare)
          [ "$code" = 200 ] || { echo "::error::compare HTTP $code: $(head -c 300 /tmp/r.json)"; exit 1; }
          ./docdiff-cli README.md README.md -q
      - uses: actions/upload-artifact@v4
        with: { name: "portable-${{ matrix.arch }}", path: "dist/*.tar.gz" }

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: scripts/build_bundle.sh docker
      - name: Smoke test
        run: |
          docker images
          docker run -d --name t -p 18080:8080 docdiff:latest 2>/tmp/err || { echo "::error::docker run: $(cat /tmp/err | tr '\n' ' ')"; exit 1; }
          for i in $(seq 1 20); do curl -fsS localhost:18080/health && break; sleep 1; done
          curl -fsS localhost:18080/health || { echo "::error::$(docker logs t 2>&1 | tail -c 600 | tr '\n' ' ')"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: docker, path: "dist/*.tar.gz" }

  release:
    needs: [portable, docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Какой архив скачать

            | Сервер | Архив |
            |---|---|
            | Linux x86_64, **без Docker** (самый простой вариант) | `docdiff-*-linux-x86_64.tar.gz` |
            | Linux ARM (aarch64), без Docker | `docdiff-*-linux-aarch64.tar.gz` |
            | Есть Docker | `docdiff-*-docker-amd64.tar.gz` |

            Python и все зависимости уже внутри — на сервере ничего не скачивается.

            ```bash
            tar xzf docdiff-*.tar.gz && cd docdiff && sudo ./install.sh
            ```

            Без root: `./start.sh` → http://<сервер>:8080
