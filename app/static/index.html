<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocDiff — сравнение документов</title>
<!-- Всё встроено в файл: без внешних шрифтов/CDN, работает в закрытом контуре -->
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --text:#1b1f24; --muted:#667085; --border:#e3e6ea;
  --accent:#2e9e3e; --accent-2:#23802f; --accent-soft:#e7f5e9;
  --del-bg:#fdecec; --del-strong:#f6b8b8; --del-text:#a4161a;
  --ins-bg:#e8f6ea; --ins-strong:#a9deb1; --ins-text:#17692a;
  --chg-bg:#fff6dc; --fold:#f0f2f5; --flash:#ffe58a;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418; --panel:#1a1e24; --text:#e6e8eb; --muted:#98a2b3; --border:#2c323a;
    --accent:#44b955; --accent-2:#5fcf70; --accent-soft:#1d3322;
    --del-bg:#3a1c1e; --del-strong:#7a2a2e; --del-text:#ff9b9b;
    --ins-bg:#16301c; --ins-strong:#26602f; --ins-text:#8ee39c;
    --chg-bg:#352d14; --fold:#20252c; --flash:#5c4d10;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo i{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
header .sub{color:var(--muted)}
header .spacer{flex:1}
main{max-width:1600px;margin:0 auto;padding:20px 24px 60px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px}
.upload{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.drop{position:relative;border:2px dashed var(--border);border-radius:12px;padding:22px;background:var(--panel);cursor:pointer;transition:.15s;min-height:118px;display:flex;flex-direction:column;justify-content:center}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.has{border-style:solid;border-color:var(--accent)}
.drop .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.drop .name{font-size:16px;font-weight:600;margin-top:6px;word-break:break-all}
.drop .hint{color:var(--muted);margin-top:4px}
.drop input{display:none}
.drop .clear{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;display:none}
.drop.has .clear{display:block}
.swap{align-self:center;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:16px}
.swap:hover{border-color:var(--accent);color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin:14px 2px 0}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.opts .spacer{flex:1}
.formats{color:var(--muted);font-size:12px}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px}
button.primary:hover{background:var(--accent-2)}
button.primary:disabled{opacity:.45;cursor:default}
button.ghost{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
button.ghost:hover{border-color:var(--accent)}
.status{margin-top:16px;padding:12px 16px;border-radius:10px;display:none}
.status.err{display:block;background:var(--del-bg);color:var(--del-text)}
.status.load{display:block;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}

#result{display:none;margin-top:20px}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:16px 20px}
.sim{font-size:30px;font-weight:700;line-height:1}
.sim small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.files{flex:1;min-width:220px}
.files div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files b{display:inline-block;width:52px;color:var(--muted);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px}
.chip.ins{background:var(--ins-bg);color:var(--ins-text)}
.chip.del{background:var(--del-bg);color:var(--del-text)}
.chip.chg{background:var(--chg-bg);color:inherit}
.chip.same{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px;border-top:1px solid var(--border)}
.toolbar .spacer{flex:1}
.counter{color:var(--muted);min-width:70px;text-align:center}
.tabs{display:flex;gap:4px;padding:10px 20px 0;border-top:1px solid var(--border);overflow-x:auto}
.tab{border:1px solid var(--border);border-bottom:0;background:var(--bg);padding:7px 12px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;color:var(--text);font-size:13px}
.tab.active{background:var(--panel);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px}
.dot.changed{background:#e0a800}.dot.added{background:var(--ins-text)}.dot.removed{background:var(--del-text)}.dot.same{background:var(--border)}
.view{overflow:auto;max-height:calc(100vh - 150px);border-top:1px solid var(--border)}

table.diff{width:100%;border-collapse:collapse;table-layout:fixed;font:12.5px/1.5 var(--mono)}
table.diff td{vertical-align:top;padding:1px 8px;white-space:pre-wrap;word-break:break-word}
table.diff td.ln{width:56px;text-align:right;color:var(--muted);user-select:none;background:var(--fold);border-right:1px solid var(--border)}
table.diff td.ln + td{border-right:1px solid var(--border)}
table.diff thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:8px;font:600 12px var(--sans);border-bottom:1px solid var(--border);z-index:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.delete td.a, tr.replace td.a{background:var(--del-bg)}
tr.insert td.b, tr.replace td.b{background:var(--ins-bg)}
tr.delete td.b, tr.insert td.a{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--fold) 6px 12px)}
span.d{background:var(--del-strong);border-radius:2px}
span.i{background:var(--ins-strong);border-radius:2px}
tr.fold td{background:var(--fold);color:var(--muted);text-align:center;cursor:pointer;font:12px var(--sans);padding:4px}
tr.fold td:hover{color:var(--accent)}
tr.flash td{animation:fl 1.2s}
@keyframes fl{0%,40%{box-shadow:inset 0 0 0 999px var(--flash)}}

table.grid{border-collapse:collapse;font:12.5px/1.4 var(--sans);min-width:100%}
table.grid th,table.grid td{border:1px solid var(--border);padding:4px 8px;white-space:pre-wrap;max-width:320px;vertical-align:top}
table.grid thead th{position:sticky;top:0;background:var(--fold);z-index:2;font-weight:600;text-align:center}
table.grid td.rn{background:var(--fold);color:var(--muted);text-align:right;white-space:nowrap;font-family:var(--mono);font-size:11.5px;position:sticky;left:0;z-index:1}
table.grid tr.insert td:not(.rn){background:var(--ins-bg)}
table.grid tr.delete td:not(.rn){background:var(--del-bg);text-decoration:line-through;text-decoration-color:var(--del-text)}
table.grid td.chg{background:var(--chg-bg)}
table.grid td.chg .o{color:var(--del-text);text-decoration:line-through;display:block}
table.grid td.chg .n{color:var(--ins-text);font-weight:600;display:block}
table.grid tr.fold td{background:var(--fold);color:var(--muted);cursor:pointer;text-align:left;font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.banner{display:none;padding:10px 14px;background:var(--accent-soft);border-radius:10px;margin-bottom:16px}
kbd{font:11px var(--mono);border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--fold)}

@media (max-width:760px){
  header{padding:12px 16px} header .sub{display:none}
  main{padding:16px}
  .upload{grid-template-columns:1fr}
  .swap{justify-self:center;transform:rotate(90deg)}
  table.diff td.ln{width:36px;padding:1px 4px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><i>≠</i>DocDiff</div>
  <div class="sub">сравнение документов · Word, Excel, PDF, PowerPoint, CSV, текст</div>
  <div class="spacer"></div>
  <span class="formats" id="ver"></span>
</header>
<main>
  <div class="banner" id="banner">Сохранённый отчёт о сравнении. Для нового сравнения откройте сервис DocDiff.</div>

  <section id="uploader">
    <div class="upload">
      <label class="drop" id="dropA">
        <button class="clear" type="button" title="Убрать">×</button>
        <span class="lbl">Документ A · было</span>
        <span class="name">Перетащите файл сюда</span>
        <span class="hint">или нажмите, чтобы выбрать</span>
        <input type="file">
      </label>
      <button class="swap" id="swap" type="button" title="Поменять местами">⇄</button>
      <label class="drop" id="dropB">
        <button class="clear" type="button" title="Убрать">×</button>
        <span class="lbl">Документ B · стало</span>
        <span class="name">Перетащите файл сюда</span>
        <span class="hint">или нажмите, чтобы выбрать</span>
        <input type="file">
      </label>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="optCase"> Не учитывать регистр</label>
      <label><input type="checkbox" id="optWs"> Не учитывать пробелы</label>
      <span class="spacer"></span>
      <span class="formats" id="formats"></span>
      <button class="primary" id="go" disabled>Сравнить</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section id="result" class="card">
    <div class="summary">
      <div class="sim" id="sim"></div>
      <div class="files" id="files"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="toolbar">
      <label><input type="checkbox" id="optOnly" checked> Только различия</label>
      <span class="spacer"></span>
      <button class="ghost" id="prev" title="Предыдущее различие (p)">↑ Пред.</button>
      <span class="counter" id="counter"></span>
      <button class="ghost" id="next" title="Следующее различие (n)">↓ След.</button>
      <button class="ghost" id="dl" title="Скачать самодостаточный HTML-отчёт">⤓ Отчёт HTML</button>
    </div>
    <div class="tabs" id="tabs" hidden></div>
    <div class="view" id="view"></div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const CONTEXT = 3;
  const state = { files: [null, null], result: null, sheet: 0, expanded: new Set(), anchors: [], pos: -1 };
  const preloaded = window.__PRELOADED__ || null;

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const fmtSize = (n) => n < 1024 ? n + ' Б' : n < 1048576 ? (n / 1024).toFixed(1) + ' КБ' : (n / 1048576).toFixed(1) + ' МБ';
  const plural = (n, one, few, many) => {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
  };

  // ---------------- загрузка файлов
  const drops = [$('dropA'), $('dropB')];
  drops.forEach((d, idx) => {
    const input = d.querySelector('input');
    input.addEventListener('change', () => input.files[0] && setFile(idx, input.files[0]));
    d.addEventListener('dragover', (e) => { e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', () => d.classList.remove('over'));
    d.addEventListener('drop', (e) => {
      e.preventDefault(); d.classList.remove('over');
      const fs = [...e.dataTransfer.files];
      if (fs.length >= 2) { setFile(0, fs[0], true); setFile(1, fs[1]); }
      else if (fs[0]) setFile(idx, fs[0]);
    });
    d.querySelector('.clear').addEventListener('click', (e) => {
      e.preventDefault(); state.files[idx] = null; input.value = ''; paintDrop(idx); updateGo();
    });
  });

  function paintDrop(idx) {
    const d = drops[idx], f = state.files[idx];
    d.classList.toggle('has', !!f);
    d.querySelector('.name').textContent = f ? f.name : 'Перетащите файл сюда';
    d.querySelector('.hint').textContent = f ? fmtSize(f.size) : 'или нажмите, чтобы выбрать';
  }
  function setFile(idx, f, silent) {
    state.files[idx] = f; paintDrop(idx); updateGo();
    if (!silent && state.files[0] && state.files[1]) run();   // сравниваем сразу, как только есть оба файла
  }
  function updateGo() { $('go').disabled = !(state.files[0] && state.files[1]); }

  $('swap').addEventListener('click', () => {
    state.files.reverse(); paintDrop(0); paintDrop(1);
    if (state.files[0] && state.files[1]) run();
  });
  $('go').addEventListener('click', run);
  ['optCase', 'optWs'].forEach((id) => $(id).addEventListener('change', () => state.files[0] && state.files[1] && run()));
  $('optOnly').addEventListener('change', () => { state.expanded.clear(); render(); });

  function status(kind, text) {
    const s = $('status');
    s.className = 'status ' + (kind || '');
    s.textContent = '';
    if (kind === 'load') s.appendChild(el('span', 'spin'));
    if (text) s.appendChild(document.createTextNode(text));
  }

  async function run() {
    const fd = new FormData();
    fd.append('file_a', state.files[0]);
    fd.append('file_b', state.files[1]);
    fd.append('ignore_case', $('optCase').checked);
    fd.append('ignore_whitespace', $('optWs').checked);
    status('load', 'Сравниваем…');
    $('go').disabled = true;
    try {
      const resp = await fetch('api/compare', { method: 'POST', body: fd });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || ('Ошибка сервера: ' + resp.status));
      status('', '');
      show(data);
    } catch (e) {
      status('err', e.message);
    } finally { updateGo(); }
  }

  // ---------------- результат
  function show(data) {
    state.result = data; state.sheet = 0; state.expanded.clear();
    if (data.mode === 'table') {
      const firstChanged = data.sheets.findIndex((s) => s.status !== 'same');
      state.sheet = Math.max(0, firstChanged);
    }
    $('result').style.display = 'block';
    renderSummary();
    render();
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderSummary() {
    const r = state.result, s = r.stats;
    const same = !s.insert && !s.delete && !s.replace;
    $('sim').textContent = (s.similarity * 100).toFixed(1).replace('.0', '') + '%';
    $('sim').appendChild(el('small', null, 'совпадение'));
    const files = $('files'); files.textContent = '';
    [['Было', r.left], ['Стало', r.right]].forEach(([k, f]) => {
      const d = el('div'); d.title = f.name;
      d.append(el('b', null, k), f.name + '  ', el('span', 'formats', fmtSize(f.size)));
      files.appendChild(d);
    });
    const chips = $('chips'); chips.textContent = '';
    if (same) chips.appendChild(el('span', 'chip same', '✓ Документы совпадают'));
    else {
      if (s.insert) chips.appendChild(el('span', 'chip ins', `+${s.insert} ${plural(s.insert, 'добавлена', 'добавлено', 'добавлено')}`));
      if (s.delete) chips.appendChild(el('span', 'chip del', `−${s.delete} ${plural(s.delete, 'удалена', 'удалено', 'удалено')}`));
      if (s.replace) chips.appendChild(el('span', 'chip chg', `~${s.replace} ${plural(s.replace, 'изменена', 'изменено', 'изменено')}`));
      if (r.mode === 'table' && s.cells_changed) chips.appendChild(el('span', 'chip chg', `${s.cells_changed} ${plural(s.cells_changed, 'ячейка', 'ячейки', 'ячеек')}`));
      if (s.sheets_added) chips.appendChild(el('span', 'chip ins', `+${s.sheets_added} ${plural(s.sheets_added, 'лист', 'листа', 'листов')}`));
      if (s.sheets_removed) chips.appendChild(el('span', 'chip del', `−${s.sheets_removed} ${plural(s.sheets_removed, 'лист', 'листа', 'листов')}`));
    }
    const tabs = $('tabs'); tabs.textContent = '';
    tabs.hidden = r.mode !== 'table';
    if (r.mode === 'table') {
      r.sheets.forEach((sh, i) => {
        const name = sh.name_a === sh.name_b || !sh.name_a || !sh.name_b ? (sh.name_a || sh.name_b) : `${sh.name_a} → ${sh.name_b}`;
        const t = el('button', 'tab' + (i === state.sheet ? ' active' : ''), name);
        const titles = { same: 'без изменений', changed: 'есть изменения', added: 'лист добавлен', removed: 'лист удалён' };
        t.title = titles[sh.status];
        t.appendChild(el('span', 'dot ' + sh.status));
        t.addEventListener('click', () => { state.sheet = i; state.expanded.clear(); renderSummary(); render(); });
        tabs.appendChild(t);
      });
    }
  }

  // Какие строки показывать: все или только изменения с контекстом
  function visibility(rows) {
    const only = $('optOnly').checked;
    const show = new Array(rows.length).fill(!only);
    if (only) {
      rows.forEach((r, i) => {
        if (r.op !== 'equal') for (let k = Math.max(0, i - CONTEXT); k <= Math.min(rows.length - 1, i + CONTEXT); k++) show[k] = true;
      });
    }
    return show;
  }

  function* walk(rows) {
    const show = visibility(rows);
    let i = 0;
    while (i < rows.length) {
      if (show[i]) { yield { row: rows[i], i }; i++; continue; }
      const start = i;
      while (i < rows.length && !show[i]) i++;
      if (state.expanded.has(start)) { for (let k = start; k < i; k++) yield { row: rows[k], i: k }; }
      else yield { fold: true, start, count: i - start };
    }
  }

  function foldRow(start, count, colspan) {
    const tr = el('tr', 'fold'), td = el('td', null, `⋯ ${count} ${plural(count, 'одинаковая строка', 'одинаковые строки', 'одинаковых строк')} — показать`);
    td.colSpan = colspan;
    tr.appendChild(td);
    tr.addEventListener('click', () => { state.expanded.add(start); render(true); });
    return tr;
  }

  function segs(td, list) {
    if (!list) return;
    list.forEach(([op, s]) => {
      if (op === '=') td.appendChild(document.createTextNode(s));
      else td.appendChild(el('span', op === '-' ? 'd' : 'i', s));
    });
  }

  function render(keepScroll) {
    const view = $('view'), top = view.scrollTop;
    view.textContent = '';
    state.anchors = []; state.pos = -1;
    const r = state.result;
    if (!r) return;
    if (r.mode === 'text') renderText(view, r); else renderSheet(view, r.sheets[state.sheet]);
    updateCounter();
    if (keepScroll) view.scrollTop = top;
  }

  function markAnchor(tr, row, prevOp) {
    if (row.op !== 'equal' && (prevOp === 'equal' || prevOp == null)) state.anchors.push(tr);
  }

  function renderText(view, r) {
    if (!r.rows.length) { view.appendChild(el('div', 'empty', 'Оба документа пустые')); return; }
    const t = el('table', 'diff'), thead = el('thead'), hr = el('tr');
    const cg = el('colgroup');
    ['56px', '', '56px', ''].forEach((w) => { const c = el('col'); if (w) c.style.width = w; cg.appendChild(c); });
    t.appendChild(cg);
    [['', 1], [r.left.name, 1], ['', 1], [r.right.name, 1]].forEach(([n]) => hr.appendChild(el('th', null, n)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el('tbody'), frag = document.createDocumentFragment();
    let prevOp = null;
    for (const item of walk(r.rows)) {
      if (item.fold) { frag.appendChild(foldRow(item.start, item.count, 4)); prevOp = 'equal'; continue; }
      const row = item.row, tr = el('tr', row.op);
      const lnA = el('td', 'ln', row.l ?? ''), a = el('td', 'a'), lnB = el('td', 'ln', row.r ?? ''), b = el('td', 'b');
      segs(a, row.a); segs(b, row.b);
      tr.append(lnA, a, lnB, b);
      markAnchor(tr, row, prevOp); prevOp = row.op;
      frag.appendChild(tr);
    }
    tb.appendChild(frag); t.appendChild(tb); view.appendChild(t);
  }

  function renderSheet(view, sh) {
    if (!sh.rows.length) { view.appendChild(el('div', 'empty', 'Лист пустой')); return; }
    const t = el('table', 'grid'), thead = el('thead'), hr = el('tr');
    hr.appendChild(el('th', null, 'A / B'));
    sh.cols.forEach((c) => hr.appendChild(el('th', null, c)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el('tbody'), frag = document.createDocumentFragment();
    let prevOp = null;
    for (const item of walk(sh.rows)) {
      if (item.fold) { frag.appendChild(foldRow(item.start, item.count, sh.cols.length + 1)); prevOp = 'equal'; continue; }
      const row = item.row, tr = el('tr', row.op);
      tr.appendChild(el('td', 'rn', `${row.l ?? '—'} / ${row.r ?? '—'}`));
      for (let c = 0; c < sh.cols.length; c++) {
        const cell = row.cells[c];
        const td = el('td');
        if (cell) {
          const [st, va, vb] = cell;
          if (st === '~') {
            td.className = 'chg';
            td.title = `${sh.cols[c]}: «${va}» → «${vb}»`;
            td.append(el('span', 'o', va || '∅'), el('span', 'n', vb || '∅'));
          } else td.textContent = st === '+' ? vb : va;
        }
        tr.appendChild(td);
      }
      markAnchor(tr, row, prevOp); prevOp = row.op;
      frag.appendChild(tr);
    }
    tb.appendChild(frag); t.appendChild(tb); view.appendChild(t);
  }

  // ---------------- навигация по различиям
  function updateCounter() {
    const n = state.anchors.length;
    $('counter').textContent = n ? `${state.pos < 0 ? '–' : state.pos + 1} / ${n}` : 'нет различий';
    $('prev').disabled = $('next').disabled = !n;
  }
  function go(delta) {
    const n = state.anchors.length;
    if (!n) return;
    state.pos = state.pos < 0 ? (delta > 0 ? 0 : n - 1) : (state.pos + delta + n) % n;
    const tr = state.anchors[state.pos], view = $('view');
    view.scrollTo({ top: tr.offsetTop - view.clientHeight / 3, behavior: 'smooth' });
    tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');
    updateCounter();
  }
  $('next').addEventListener('click', () => go(1));
  $('prev').addEventListener('click', () => go(-1));
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || !state.result) return;
    if (e.key === 'n' || e.key === 'т') go(1);
    if (e.key === 'p' || e.key === 'з') go(-1);
  });

  // ---------------- HTML-отчёт
  $('dl').addEventListener('click', async () => {
    try {
      const src = await (await fetch('./', { cache: 'no-cache' })).text();
      const payload = JSON.stringify(state.result).replace(/</g, '\\u003c');
      const html = src.replace('</head>', `<script>window.__PRELOADED__=${payload};<\/script>\n</head>`);
      const base = (n) => n.replace(/\.[^.]+$/, '').replace(/[^\wа-яё.-]+/gi, '_');
      const a = el('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = `diff_${base(state.result.left.name)}__${base(state.result.right.name)}.html`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) { status('err', 'Не удалось сформировать отчёт: ' + e.message); }
  });

  // ---------------- старт
  if (preloaded) {
    $('uploader').style.display = 'none';
    $('banner').style.display = 'block';
    $('dl').style.display = 'none';
    show(preloaded);
  } else {
    fetch('api/info').then((r) => r.json()).then((info) => {
      $('ver').textContent = 'v' + info.version;
      $('formats').textContent = 'до ' + info.max_upload_mb + ' МБ на файл' + (info.libreoffice ? ' · .doc/.rtf/.odt через LibreOffice' : '');
      $('formats').title = 'Поддерживаемые форматы: ' + info.extensions.join(' ');
      drops.forEach((d) => d.querySelector('input').accept = info.extensions.join(','));
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
